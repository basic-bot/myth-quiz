<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which Greek Myth Character Are You?</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--tx:#23201a;--mut:#6b6558;--ac:#2f5d8a;--bd:#ddd6c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--card:#221f17;--tx:#eee9dc;--mut:#a59f8e;--ac:#7fb0e0;--bd:#3a3529}}
:root[data-theme="dark"]{--bg:#17150f;--card:#221f17;--tx:#eee9dc;--mut:#a59f8e;--ac:#7fb0e0;--bd:#3a3529}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 Georgia,serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.45rem;margin:.2em 0}
.mut{color:var(--mut);font-size:.9rem}
.bar{height:5px;background:var(--bd);border-radius:3px;margin:14px 0 22px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
button{display:block;width:100%;text-align:left;margin:0 0 9px;padding:12px 14px;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;cursor:pointer}
button:active{border-color:var(--ac)}
button.go{background:var(--ac);color:#fff;text-align:center;border:0}
.res{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:12px}
.res h2{margin:0 0 6px}
</style></head><body><main id="m"></main>
<script>
// Traits: w wisdom, f fighter, c craft, r rebel, l loyal, n nature, d dark, a arts/charm, t trickster, h caring, k ruler, q wanderer
var C=("Zeus|kfa|Sky king who rules by force and charm.;Hera|lkd|Fiercely committed, with a long memory.;Poseidon|nfk|Moody sea ruler, calm one moment, storm the next.;Demeter|hln|Patient provider who holds the harvest and her family together.;Athena|wfc|Strategist and craftsperson who prefers a plan.;Apollo|ahw|Music, healing and clear thinking.;Artemis|nfq|Independent hunter at home in the wild.;Ares|fdr|Direct, loud and always near a fight.;Aphrodite|alt|Charm, beauty and a knack for stirring things up.;Hephaestus|clh|Quiet maker who lets his work speak.;Hermes|tqa|Fast, clever messenger who crosses every border.;Dionysus|arn|Wine, theatre and loosening up a crowd.;Hestia|hlw|Keeper of the hearth, calm and steady.;Hades|dkl|Fair, private ruler of the underworld.;"
+"Chaos|rdq|The open void before everything else.;Gaia|nhk|The earth itself, source of nearly everyone.;Uranus|kdn|Sky ruler overthrown by his own children.;Nyx|dwk|Night, powerful enough that even Zeus avoided her.;Eros|alr|Love that arrives without asking.;Chronos|wkq|Time itself, always moving on.;"
+"Cronus|kdr|Titan king who feared being replaced.;Rhea|hlt|Mother who outwitted her husband to save her child.;Oceanus|nwq|The great river around the world, deep and unhurried.;Themis|wkl|Divine law and fair judgement.;Mnemosyne|wah|Memory, and mother of the Muses.;Atlas|fld|Holds up the sky without complaint.;Prometheus|rct|Gave humans fire and paid for it.;Epimetheus|tlq|Acts first and thinks later.;Helios|aqk|Drives the sun across the sky each day.;Selene|ahq|Moon goddess, quiet and constant.;Leto|hlq|Wandering mother determined to find safe ground.;Metis|wth|Cunning counsellor of the early gods.;"
+"Persephone|dhq|Moves between spring above and the dead below.;Hecate|dwh|Crossroads, magic and keys between worlds.;Pan|nat|Wild shepherd god, playful and unpredictable.;Nike|fak|Victory, quick to the winning side.;Iris|qlt|Rainbow messenger, reliable and fast.;Hebe|ahl|Cupbearer of the gods, youth and welcome.;Morpheus|ahd|Shapes the dreams people have in sleep.;Thanatos|dwl|Gentle, unavoidable death.;Nemesis|kdw|Balances the books after pride.;Tyche|atq|Fortune, which can turn either way.;Asclepius|hwc|Healer so good he raised the dead.;Triton|nfa|Sea trumpeter, loud and cheerful.;Eris|rdt|Discord, happiest when a party goes sideways.;Charon|dlq|Ferryman with one job and no shortcuts.;Calliope|awh|Muse of epic poetry.;The Fates|wkd|Spin, measure and cut the thread of life.;"
+"Medusa|dlr|Cursed and misunderstood, with a stare nobody forgot.;Minotaur|fdn|Strong and alone in a labyrinth.;Hydra|ndr|Cut off one head and two return.;Cerberus|dlf|Three-headed guard who never leaves his post.;Chimera|ndf|Lion, goat and snake in one.;Sphinx|wtd|Asks riddles and keeps the door shut until answered.;Polyphemus|nfl|One-eyed shepherd who takes his flock seriously.;Typhon|rfn|Storm giant who nearly toppled Zeus.;Echidna|ndh|Mother of monsters.;Scylla|dnr|Cliff-side horror guarding a narrow strait.;Sirens|adt|Song so good sailors forget to steer.;Nemean Lion|nfd|Invulnerable, until someone strong enough arrives.;Harpies|tfq|Winged snatchers, fast and hard to catch.;Ladon|nld|Dragon guarding the golden apples.;"
+"Chiron|hwn|Wise centaur who taught the heroes.;Pegasus|qnl|Winged horse, loyal to his rider.;Phoenix|qhr|Burns down, rises again.;Calypso|alq|Island nymph who kept a guest for seven years.;Argus Panoptes|lwd|Hundred-eyed watcher who never fully sleeps.;Talos|fcl|Bronze guardian of Crete.;Marsyas|ara|Satyr who challenged Apollo to a music contest.;"
+"Heracles|fql|Strongest hero, doing twelve labours for forgiveness.;Perseus|fqt|Beat Medusa with a mirror and some cunning.;Theseus|fkq|Beat the Minotaur, then became king.;Achilles|far|Greatest warrior, with one weak spot.;Odysseus|wtq|Clever traveller, ten years from home.;Jason|qkf|Leader of the Argonauts, chasing the Golden Fleece.;Bellerophon|fqr|Rode Pegasus to slay the Chimera.;Orpheus|adq|Musician who walked into the underworld for love.;Atalanta|fnq|Runner and hunter who beat the men at their own games.;Cadmus|qkl|Founder of Thebes, a wanderer turned king.;Aeneas|lkq|Carried his family out of Troy to found something new.;Hector|flk|Troy’s defender, dutiful to the end.;Ajax|flr|Huge, stubborn fighter with fragile pride.;Diomedes|fwl|Steady Greek warrior who even fought gods.;Telemachus|lqw|Son who goes looking for his father.;Oedipus|wqd|Solved the Sphinx’s riddle, but not his own story.;"
+"Penelope|wlt|Waited twenty years and still outsmarted her suitors.;Antigone|lrd|Buried her brother against the king’s orders.;Agamemnon|kfl|King of kings leading the Greek army.;Helen|aqd|Cause of a ten-year war, with a complicated role in it.;Cassandra|wdl|Sees what is coming, and nobody listens.;Andromache|lhw|Held her family together as Troy fell.;Clytemnestra|rkd|Queen who took revenge into her own hands.;Medea|cdr|Sorceress willing to burn everything for her side.;Ariadne|wlq|Gave Theseus the thread that got him out.;Daedalus|ctq|Inventor who built the labyrinth and the wings.;Icarus|rqa|Flew too close to the sun.;Sisyphus|trd|Outwitted death, then pushed a boulder forever.;Midas|kad|King whose wish for gold got out of hand.;Pandora|hrq|Opened the jar and let everything out, but kept hope.;Arachne|cra|Weaver who challenged Athena.").split(";").map(function(s){return s.split("|")});
var Q=[
["How do you most like to spend a free evening?",[["Building or fixing something","cw"],["A long walk outdoors","nq"],["Friends, music and food","ah"],["Reading or planning something","wk"],["Training or playing a sport","fn"],["Something dark and quiet","dw"],["Pulling a harmless prank","tr"],["Cooking for people I care about","hl"]]],
["A group project is going badly. You…",[["Take charge and reassign the work","kf"],["Find a clever workaround","tw"],["Quietly fix my part and keep going","cl"],["Lighten the mood first","ah"],["Refuse to follow the bad plan","rf"],["Check on how everyone is doing","hl"],["Go looking for help elsewhere","qn"],["Expect the worst and prepare for it","dw"]]],
["Which setting feels most like you?",[["The coast","nq"],["Mountains or forest","nf"],["A city library","wk"],["A workshop","cd"],["A stage or a festival","at"],["An arena or battlefield","fk"],["A cellar at night","dw"],["A warm home with a hearth","lh"]]],
["What matters most in your work?",[["Doing the craft really well","cw"],["Fairness and clear rules","kl"],["Freedom to experiment","rt"],["Caring for the people involved","hl"],["Being recognised","ak"],["Winning","fk"],["Exploring new things","qn"],["Going deep on hard problems","dw"]]],
["In a conflict, you usually…",[["Say it directly and face it","fk"],["Talk your way to a solution","tw"],["Say little and remember everything","dl"],["Walk away until it cools down","nq"],["Fight the rules themselves","rf"],["Use charm","at"],["Mediate between both sides","hw"],["Step in to protect someone","lf"]]],
["Friends would most likely describe you as…",[["Loyal, sometimes to a fault","lh"],["Funny and unpredictable","ta"],["Calm and a bit hard to read","dw"],["Driven and intense","fr"],["Gentle","hn"],["Adventurous","qf"],["A perfectionist","cw"],["Dramatic","ar"]]],
["An unexpected bit of money arrives. You…",[["Buy better tools","cr"],["Throw a party","at"],["Book a trip","qn"],["Make home cozier","lh"],["Save or invest it","kw"],["Give some away","hr"],["Spend it on training or competition","fk"],["Buy something strange and secret","dt"]]],
["When you help someone learn, you…",[["Go step by step","wh"],["Show them by doing it","cf"],["Tell stories and examples","aq"],["Hand over the tools and step back","rk"],["Challenge them hard","ft"],["Stay patient as long as it takes","hl"],["Ask riddles and questions","wt"],["Hold them to a standard","kd"]]],
["Which flaw sounds most familiar?",[["Pride","ka"],["A short temper","fn"],["Holding grudges","dl"],["Restlessness","qt"],["Trusting too easily","lh"],["Stubbornness","rc"],["Overthinking","wd"],["Recklessness","fr"]]],
["What would you most like to leave behind?",[["Something built that lasts","ck"],["People who learned from you","hw"],["A good story","aq"],["A peaceful life, left mostly alone","dn"],["A victory","fk"],["A rule that changed","rk"],["A family or group that was protected","lh"],["A place nobody had found before","qn"]]]
];
var i=0,T={},m=document.getElementById("m");
function start(){i=0;T={};q()}
function q(){
 if(i>=Q.length)return done();
 var h='<p class="mut">Question '+(i+1)+' of '+Q.length+'</p><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><h1>'+Q[i][0]+'</h1><br>';
 Q[i][1].forEach(function(o,k){h+='<button onclick="pick('+k+')">'+o[0]+'</button>'});
 m.innerHTML=h;window.scrollTo(0,0)}
function pick(k){Q[i][1][k][1].split("").forEach(function(t,n){T[t]=(T[t]||0)+(n?1:2)});i++;q()}
function done(){
 var r=C.map(function(c){var s=0;c[1].split("").forEach(function(t,n){s+=(T[t]||0)*(n?1:2)});return{c:c,s:s+Math.random()*.5}}).sort(function(a,b){return b.s-a.s}).slice(0,5);
 var h='<p class="mut">Your closest match out of 100</p><div class="res"><h2>'+r[0].c[0]+'</h2>'+r[0].c[2]+'</div><p class="mut">Also close</p>';
 r.slice(1).forEach(function(x){h+='<div class="res"><b>'+x.c[0]+'</b><br>'+x.c[2]+'</div>'});
 h+='<p class="mut">Just for fun, not a personality test.</p><button class="go" onclick="start()">Take it again</button>';
 m.innerHTML=h;window.scrollTo(0,0)}
m.innerHTML='<h1>Which Greek myth character are you?</h1><p class="mut">10 questions, 8 options each, 100 possible matches: gods, primordials, Titans, monsters, creatures, heroes, kings and mortals. Go with your first instinct.</p><br><button class="go" onclick="start()">Start</button>';
</script></body></html>
